<!DOCTYPE html>
<html>
<head>
    <title>Emotion Detector</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <script src="./static/mywebscript.js"></script>
    <style>
        .center-heading {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-body">
            <h1 class="center-heading">NLP - Emotion Detection</h1> 
            <div style="padding: 25px 25px 25px 25px;">
                <p>Enter the text you want to analyze for emotions:</p>
                <input type="text" id="textToAnalyze" class="form-control" name="textToAnalyze"><br>
                <button type="submit" class="btn btn-primary" onclick="RunSentimentAnalysis()">Run Sentiment Analysis</button>
            </div>
            <div style="padding: 25px 25px 25px 25px;">
                <div id="system_response">
                </div>
            </div>
        </div>
    </div>
</body>
</html>
